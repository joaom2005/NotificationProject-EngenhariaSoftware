# ===================================================================
# Application Settings
# ===================================================================
spring.application.name=ProjectNotification
server.port=8080
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Database Connection (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3307/notificationDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Gmail SMTP settings. Supply credentials through environment variables.
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ===================================================================
# Asynchronous sending with retries
# ===================================================================
# How often the scheduler looks for pending notifications (ms)
app.delivery.poll-interval-ms=5000
# Total number of attempts before a notification is marked FAILED
app.delivery.max-attempts=5
# Wait after the 1st failure; after the n-th failure the wait is n * retry-delay
app.delivery.retry-delay=30s

# Failure simulation for dev/demo. Off by default.
app.delivery.simulate.enabled=off
# Each notification fails this many times and then succeeds. Negative = always fail.
app.delivery.simulate.failures-per-notification=2

# Idempotent sending: before sending, look for the notification's Message-ID in the sent folder
# over IMAP, so a retry never duplicates an email that was already delivered. Off by default.
app.delivery.verify.enabled=false
app.delivery.verify.imap-host=imap.gmail.com
app.delivery.verify.sent-folder=[Gmail]/Sent Mail

# ===================================================================
# Spring Data JPA / Hibernate Configuration
# ===================================================================
# Schema DDL mode: 'update' automatically updates/creates tables without dropping data
spring.jpa.hibernate.ddl-auto=update

# Show and format generated SQL queries in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensure tables are created before running data.sql / schema.sql initializers
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===================================================================
# Thymeleaf Template Engine Settings
# ===================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Set cache to false for development (templates recompile without restarting the app)
spring.thymeleaf.cache=false

# ===================================================================
# Static Resources & File Handling
# ===================================================================
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.root=INFO
logging.level.pt.ipportalegre.estgd.ei.es.projectnotification=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE