# ===================================================================
# Application Settings
# ===================================================================
spring.application.name=ProjectNotification
server.port=8080
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Database Connection (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3307/notificationDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Gmail SMTP settings. Supply credentials through environment variables.
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ===================================================================
# Spring Data JPA / Hibernate Configuration
# ===================================================================
# Schema DDL mode: 'update' automatically updates/creates tables without dropping data
spring.jpa.hibernate.ddl-auto=update

# Explicitly set MySQL dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Show and format generated SQL queries in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensure tables are created before running data.sql / schema.sql initializers
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===================================================================
# Thymeleaf Template Engine Settings
# ===================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Set cache to false for development (templates recompile without restarting the app)
spring.thymeleaf.cache=false

# ===================================================================
# Static Resources & File Handling
# ===================================================================
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.root=INFO
logging.level.pt.ipportalegre.estgd.ei.es.projectquiz=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE