<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Notification</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="navbar">
    <div class="container navbar-content">

        <a class="logo"
           th:href="@{/notifications}">
            Notification System
        </a>

        <nav>
            <a th:href="@{/notifications}">
                Notifications
            </a>
        </nav>

    </div>
</header>


<main class="container">

    <div class="page-header">
        <div>
            <h1>Create Notification</h1>

            <p class="subtitle">
                Create and send a new notification.
            </p>
        </div>
    </div>


    <div class="card">

        <form th:action="@{/notifications}"
              th:object="${notification}"
              method="post">

            <!-- Subject -->

            <div class="form-group">
                <label for="subject">Subject</label>

                <input
                        type="text"
                        id="subject"
                        th:field="*{subject}"
                        maxlength="255"
                        placeholder="Notification subject"
                        required>

                <p class="form-error"
                   th:if="${#fields.hasErrors('subject')}"
                   th:errors="*{subject}">
                </p>
            </div>

            <!-- Channel -->

            <div class="form-group">
                <label for="channel">Channel</label>

                <select id="channel" th:field="*{channel}">
                    <option th:each="c : ${channels}"
                            th:value="${c}"
                            th:text="${c}"
                            th:attr="data-requires-recipients=${c.requiresRecipients()}">EMAIL</option>
                </select>

                <p class="form-error"
                   th:if="${#fields.hasErrors('channel')}"
                   th:errors="*{channel}">
                </p>
            </div>

            <!-- Recipients -->

            <div class="form-group" id="recipients-group">
                <label for="recipients">Recipients</label>

                <input type="text" id="recipients" th:field="*{recipients}"
                       placeholder="a@example.com, b@example.com">

                <p class="form-error"
                   th:each="err : ${#fields.errors('recipients*')}"
                   th:text="${err}">
                </p>
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" th:field="*{priority}">
                    <option value="HIGH">High</option>
                    <option value="NORMAL">Normal</option>
                    <option value="LOW">Low</option>
                </select>
                <p class="form-error" th:errors="*{priority}"></p>
            </div>


            <!-- Message -->

            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                        id="message"
                        th:field="*{message}"
                        rows="8"
                        placeholder="Write your notification..."
                        required>
                </textarea>

                <p class="form-error"
                   th:if="${#fields.hasErrors('message')}"
                   th:errors="*{message}">
                </p>

            </div>


            <!-- Buttons -->

            <div class="form-actions">

                <a class="button"
                   th:href="@{/notifications}">
                    Cancel
                </a>

                <button
                        type="submit"
                        class="button button-primary">
                    Send Notification
                </button>

            </div>

        </form>

    </div>

</main>

<script>
    (function () {
        const channel = document.getElementById('channel');
        const group = document.getElementById('recipients-group');
        const input = document.getElementById('recipients');

        function update() {
            const needs = channel.selectedOptions[0].dataset.requiresRecipients === 'true';
            group.hidden = !needs;
            input.required = needs;
            input.disabled = !needs;   // disabled inputs are not submitted
        }

        channel.addEventListener('change', update);
        update();   // also runs after a validation error re-renders the form
    })();
</script>

</body>
</html>
