<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notification Details</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="navbar">

    <div class="container navbar-content">

        <a class="logo"
           th:href="@{/notifications}">
            Notification System
        </a>

        <nav>
            <a th:href="@{/notifications}">
                Notifications
            </a>
        </nav>

    </div>

</header>


<main class="container">

    <div class="page-header">

        <div>

            <h1 th:text="${notification.subject}">
                Notification Subject
            </h1>

            <p class="subtitle">
                Notification details
            </p>

        </div>

        <a class="button"
           th:href="@{/notifications}">
            ← Back
        </a>

    </div>


    <div class="card notification-details">


        <div class="detail-row">
            <span class="detail-label">Recipients</span>
            <div>
                <div th:each="recipient : ${notification.recipients}"
                     th:text="${recipient}">
                    example@example.com
                </div>
            </div>
        </div>

        <hr>

        <div class="message">
            <h2>Message</h2>
            <p th:text="${notification.message}">
                This is the notification message.
            </p>
        </div>
    </div>
</main>

</body>
</html>
